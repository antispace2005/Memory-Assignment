name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name MemoryAllocationSegmentation --add-data "main_window.ui;." --add-data "styles.qss;." app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryAllocationSegmentation-windows-exe
          path: dist/MemoryAllocationSegmentation.exe
