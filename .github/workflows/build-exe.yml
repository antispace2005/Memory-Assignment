name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole --name MemoryAllocationSegmentation --add-data "main_window.ui;." --add-data "styles.qss;." app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryAllocationSegmentation-windows-exe
          path: dist/MemoryAllocationSegmentation.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} dist/MemoryAllocationSegmentation.exe --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
